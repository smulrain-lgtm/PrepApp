; PrepApp CouchDB settings (mounted into /opt/couchdb/etc/local.d/).

[couchdb]
single_node = true
; Photos of shut-offs are compressed in the app; keep a sane upper limit.
max_document_size = 8000000

[chttpd]
; Every request needs a login, except the /_up health check the app uses
; for "Test connection".
require_valid_user_except_for_up = true

[chttpd_auth]
; Long sessions are not used: the app sends the login with each request.
timeout = 600

[cors]
; CORS is handled by Caddy, not CouchDB.
origins =
